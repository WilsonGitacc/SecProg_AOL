# Global ServerName to eliminate AH00558 warning during container startup
ServerName localhost

# Server banner suppression: hide Apache version and OS details
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Deny access to hidden files, dotfiles, version control, and sensitive configuration files
<FilesMatch "^\.|\.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|env|yml|yaml|md|json|lock)$">
    Require all denied
</FilesMatch>

# Global root filesystem lockdown
<Directory />
    AllowOverride None
    Require all denied
</Directory>

# Defense-in-depth baseline HTTP security response headers
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Cross-Origin-Resource-Policy "same-origin"
Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()"
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
