[PHP]
; Information Disclosure Prevention
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php_error.log
log_errors_max_len = 1024
ignore_repeated_errors = On
ignore_repeated_source = Off

; Remote Inclusion Prevention
allow_url_fopen = On
allow_url_include = Off

; File Upload Restrictions (OWASP ASVS L2 aligned)
file_uploads = On
upload_tmp_dir = /tmp
upload_max_filesize = 10M
max_file_uploads = 5
post_max_size = 12M

; Resource Quotas
max_execution_time = 30
max_input_time = 30
memory_limit = 128M

; Session Lifecycle & Cookie Hardening
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = SECURE_LMS_SESSID
session.auto_start = 0
session.cookie_lifetime = 0
session.cookie_path = /
session.cookie_domain = ""
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 1800
session.cache_limiter = nocache

; Directory Lockdown & Function Restrictions
; Note: open_basedir & disable_functions are enforced strictly in VirtualHost (default-ssl.conf)
; via php_admin_value for Web SAPI, ensuring web requests are locked down while CLI tools
; (Composer, migrate.php, run_tests.sh) retain essential binary execution rights.
