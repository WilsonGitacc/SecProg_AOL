# Unprivileged HTTP Listener: Redirect all cleartext HTTP traffic to local HTTPS
<VirtualHost *:8080>
    ServerName localhost
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{SERVER_NAME}:8443/$1 [R=301,L]
</VirtualHost>

# Unprivileged HTTPS Listener: Primary TLS Application VirtualHost
<VirtualHost *:8443>
    ServerName localhost
    DocumentRoot /var/www/html/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES:!CAMELLIA:!AES128
    SSLHonorCipherOrder on

    # Public document root restrictions and routing
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        
        <RequireAll>
            # Enforce HTTP Method Allowlist (strictly GET, POST, HEAD, OPTIONS)
            <LimitExcept GET POST HEAD OPTIONS>
                Require all denied
            </LimitExcept>
            Require all granted
        </RequireAll>

        # Front-controller rewrite pattern routing all requests to index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L,QSA]
    </Directory>

    # Enforce strict PHP execution boundary and function lockdown for Web SAPI
    php_admin_value disable_functions "exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source,phpinfo"
    php_admin_value open_basedir "/var/www/html/:/tmp/:/dev/urandom"

    LogLevel warn
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
